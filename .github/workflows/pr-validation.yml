name: "Flow 1 - PR Validation"        

on:                                   
  pull_request:                       
    branches: [develop, main]         

permissions:
  contents: read                      

jobs:
  docker-build:                       
    runs-on: ubuntu-latest            
    steps:
      - name: Checkout code
        uses: actions/checkout@v7     

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4  

      - name: Docker build (không push)
        uses: docker/build-push-action@v7
        with:
          context: .                   
          push: false                  
          tags: cypress-cicd-lab:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha           
          cache-to: type=gha,mode=max    